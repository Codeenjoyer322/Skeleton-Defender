<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Skeleton Defender</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b151b;color:#e5e4cd;font-family:Arial,sans-serif}
    body{display:grid;place-items:center}#game{width:min(100vw,160vh);height:min(100vh,62.5vw);position:relative}
    canvas{width:100%;height:100%;display:block;outline:none}#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#101e29}
    .eyebrow{font-size:12px;color:#9eafa3;letter-spacing:4px}h1{font-size:clamp(23px,4vw,46px);letter-spacing:3px;margin:18px 0 12px}h1 span{color:#ddbb73}
    .track{height:4px;width:min(300px,65vw);background:#334741;margin-top:26px}#progress{height:100%;width:0;background:#ddbb73;transition:width .15s}
    #status{color:#9eafa3;font-size:14px;margin-top:18px}.error{max-width:550px;padding:25px;text-align:center;line-height:1.6;color:#df8b75}
  </style>
</head>
<body>
  <main id="game">
    <canvas id="unity-canvas" width="1440" height="900" tabindex="0" aria-label="Skeleton Defender — игра Tower Defence"></canvas>
    <div id="loading"><div class="eyebrow">УДЕРЖИ ПОСЛЕДНИЙ РУБЕЖ</div><h1>SKELETON <span>DEFENDER</span></h1><div class="track"><div id="progress"></div></div><div id="status">Подготовка крепости…</div></div>
  </main>
  <script>
    const canvas=document.getElementById('unity-canvas');
    const config={dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'Skeleton Defender',productName:'Skeleton Defender',productVersion:'0.6.2',autoSyncPersistentDataPath:true};
    const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';
    function failed(error){document.getElementById('loading').innerHTML='';const p=document.createElement('p');p.className='error';p.textContent='Не удалось загрузить игру. Обнови страницу в современном браузере. '+String(error);document.getElementById('loading').appendChild(p);console.error(error)}
    script.onload=()=>createUnityInstance(canvas,config,p=>{document.getElementById('progress').style.width=Math.round(p*100)+'%';document.getElementById('status').textContent='Подготовка крепости… '+Math.round(p*100)+'%'}).then(instance=>{window.unityInstance=instance;document.getElementById('loading').remove();canvas.focus()}).catch(failed);
    script.onerror=()=>failed('Не найден загрузчик Unity.');document.body.appendChild(script);
    canvas.addEventListener('pointerdown',()=>canvas.focus());
  </script>
</body>
</html>
